spring.application.name=hce-medicina-general

# ===============================
# SERVER
# ===============================
server.port=8080
# El backend va detrás de nginx/Caddy: se confía en X-Forwarded-Proto y X-Forwarded-For para
# marcar la cookie como Secure bajo HTTPS y registrar la IP real en la auditoría.
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

# ===============================
# DATASOURCE (MySQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hce_medicina_general?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===============================
# JPA / HIBERNATE
# ===============================
# El esquema lo gestiona Flyway; Hibernate nunca lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# FLYWAY (classpath:db/migration)
# ===============================
# Base vacía: se ejecutan V1 y siguientes.
# Base existente sin historial de Flyway (instalación anterior): se marca como V1 y solo se aplican las posteriores.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jackson.time-zone=America/Guayaquil

# ===============================
# CATÁLOGO CIE-10
# ===============================
# Excel que se importa la primera vez (si la tabla está vacía).
hce.cie10.archivo=${CIE10_FILE:CIE10.xls}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT_SECRET, HCE_ADMIN_USERNAME, HCE_ADMIN_PASSWORD y ALLOWED_ORIGINS se leen del entorno
# (.env). No tienen valor por defecto: el backend no arranca si faltan.
