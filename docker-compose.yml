version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sistema-medico-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hce_reto
    ports:
      - "3305:3306"
    volumes:
      - ./ordenado.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: sistema-medico-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/hce_reto?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    volumes:
      - ./CIE10.xls:/app/CIE10.xls
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./Fronted
      dockerfile: Dockerfile
    container_name: sistema-medico-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
