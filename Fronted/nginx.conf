# Inicios de sesión: 10 por minuto por IP (ráfaga de 10). Evita que alguien sin cuenta
# rote nombres de usuario para esquivar el bloqueo y llenar la tabla de auditoría.
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # El video de la portada viene de un CDN externo; todo lo demás es del propio servidor.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # API: mismo origen que la app, así la cookie de sesión funciona sin CORS.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se reemplazan las cabeceras del cliente: nadie puede inventarse otra IP para
        # esquivar el bloqueo de login o falsear la auditoría.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
        # Respuestas con datos clínicos: nunca en caché.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Actuator y cualquier otra ruta del backend no se publican.
    location /actuator/ { return 404; }

    location ~ /\. { deny all; }

    # SPA: React Router resuelve las rutas.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
